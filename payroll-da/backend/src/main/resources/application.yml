server:
  port: ${PORT:8080}

spring:
  application:
    name: payroll-da
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/PayRoll-DA}
    username: ${DB_USER:payroll}
    password: ${DB_PASSWORD:payroll}
  flyway:
    enabled: true
    # Banco criado pelos scripts de banco/ (tabelas já existem): começa a partir da versão 3.
    baseline-on-migrate: true
    baseline-version: 3
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# Administrador criado na primeira subida, quando não há nenhum usuário. Troque a senha depois.
payroll:
  admin:
    email: ${ADMIN_EMAIL:admin@payroll.local}
    senha: ${ADMIN_SENHA:admin}

management:
  endpoints:
    web:
      exposure:
        include: health

# Configuração da importação.
# Quando tivermos o arquivo oficial do TCE-PR, basta ajustar os nomes das colunas abaixo
# (lado direito) para os nomes que aparecem no cabeçalho do CSV. A comparação ignora
# maiúsculas, acentos, espaços e underlines.
tce:
  importacao:
    # Endereço padrão usado por POST /api/importacoes/url quando nenhuma URL é enviada.
    # Deixe vazio até confirmarmos o link de dados abertos do TCE-PR.
    url-padrao: ${TCE_URL_PADRAO:}
    # Domínios de onde o sistema aceita baixar arquivos.
    dominios-permitidos:
      - tce.pr.gov.br
      - servicos.tce.pr.gov.br
      - www1.tce.pr.gov.br
    charset: ${TCE_CHARSET:ISO-8859-1}
    delimitador: ";"
    tamanho-lote: 1000
    max-erros-registrados: 200
    colunas:
      municipio: municipio
      cod-ibge: cod_ibge
      entidade: entidade
      poder: poder
      ano: ano
      mes: mes
      despesa-bruta: despesa_bruta
      pessoal-ativo: pessoal_ativo
      inativos-pensionistas: inativos_pensionistas
      outras-despesas: outras_despesas_pessoal
      nao-computadas: despesas_nao_computadas
      despesa-total: despesa_total_pessoal
      rcl-ajustada: rcl_ajustada
    # Endereço usado pelo botão "Consultar". Placeholders: {codIbge}, {ano}, {mes}.
    # Vazio = a consulta usa os dados já importados no banco.
    url-consulta: ${TCE_URL_CONSULTA:}
  simam:
    url: ${TCE_SIMAM_URL:https://simam.tce.pr.gov.br/Paginas/Rel_LRF.aspx?relTipo=1}
    espera-ms: 1500
    diagnostico: ${SIMAM_DIAGNOSTICO:/tmp/simam-diagnostico}
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:5173}

# Chatbot. A chave fica só no servidor (variável de ambiente), nunca no front.
groq:
  api-key: ${GROQ_API_KEY:}
  modelo: ${GROQ_MODELO:llama-3.3-70b-versatile}
  max-tokens: 1500
  url: https://api.groq.com/openai/v1/chat/completions
