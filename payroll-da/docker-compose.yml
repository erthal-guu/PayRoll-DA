# Sobe banco, backend e front de uma vez: docker compose up --build
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: payroll_da
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
    ports: ["5432:5432"]
    volumes: [dados-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll_da"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://banco:5432/payroll_da
      DB_USER: payroll
      DB_PASSWORD: payroll
      CORS_ORIGENS: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TCE_URL_CONSULTA: ${TCE_URL_CONSULTA:-}
    ports: ["8080:8080"]
    depends_on:
      banco: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USAR_MOCK: "false"
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  dados-pg:
